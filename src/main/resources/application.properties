spring.application.name=ApiGateway
server.port=${GATEWAY_SERVER_PORT:8080}

spring.cloud.gateway.routes[0].id=catalog-service-v1
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/products/**,/api/v1/search/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[0].uri=${CATALOG_SERVICE_URI:http://localhost:8082}

spring.cloud.gateway.routes[1].id=catalog-service-legacy
spring.cloud.gateway.routes[1].predicates[0]=Path=/products/**,/search/**
spring.cloud.gateway.routes[1].uri=${CATALOG_SERVICE_URI:http://localhost:8082}

spring.cloud.gateway.routes[2].id=auth-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.routes[2].uri=${AUTH_SERVICE_URI:http://localhost:8081}

spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/payments/**
spring.cloud.gateway.routes[3].uri=${PAYMENT_SERVICE_URI:http://localhost:8083}

security.jwt.issuer=${AUTH_ISSUER_URI:http://localhost:8081}
security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
security.jwt.audience=${AUTH_AUDIENCE:platform-api}
